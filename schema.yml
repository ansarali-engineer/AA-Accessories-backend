      description: |-
        * `shipped` - Shipped
        * `delivered` - Delivered
    TierEnum:
      enum:
      - standard
      - silver
      - gold
      type: string
      description: |-
        * `standard` - Standard
        * `silver` - Silver
        * `gold` - Gold
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
