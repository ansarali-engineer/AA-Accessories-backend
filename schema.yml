components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: integer
          nullable: true
        parent_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - parent_name
      - slug
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        username:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
          writeOnly: true
        first_name:
          type: string
          writeOnly: true
        last_name:
          type: string
          writeOnly: true
        phone:
          type: string
          maxLength: 32
        city:
          type: string
          maxLength: 80
        tier:
          $ref: '#/components/schemas/TierEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - user
      - username
    CustomerRegistration:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          default: ''
          maxLength: 150
        last_name:
          type: string
          default: ''
          maxLength: 150
        phone:
          type: string
          default: ''
          maxLength: 32
        city:
          type: string
          default: ''
          maxLength: 80
      required:
      - email
      - password
      - username
    Employee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        title:
          type: string
          maxLength: 120
        department:
          type: string
          maxLength: 80
        salary:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        manager:
          type: integer
          nullable: true
        manager_name:
          type: string
          readOnly: true
        hired_at:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - department
      - email
      - first_name
      - hired_at
      - id
      - last_name
      - manager_name
      - salary
      - title
    OrderCreate:
      type: object
      properties:
        customer:
          type: integer
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          default: card
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderCreateItem'
      required:
      - items
    OrderCreateItem:
      type: object
      properties:
        product:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
      required:
      - product
      - quantity
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - line_total
      - product
      - product_name
      - quantity
      - unit_price
    OrderRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        customer_email:
          type: string
          format: email
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderReadStatusEnum'
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          readOnly: true
        payment_status:
          type: string
          nullable: true
          readOnly: true
        shipment:
          allOf:
          - $ref: '#/components/schemas/ShipmentRead'
          nullable: true
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        placed_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - customer
      - customer_email
      - id
      - items
      - payment_method
      - payment_status
      - placed_at
      - shipment
      - status
      - total_amount
      - updated_at
    OrderReadStatusEnum:
      enum:
      - draft
      - placed
      - paid
      - shipped
      - delivered
      - refund_pending
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `placed` - Placed
        * `paid` - Paid
        * `shipped` - Shipped
        * `delivered` - Delivered
        * `refund_pending` - Refund pending
        * `cancelled` - Cancelled
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedCustomerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
    PaginatedEmployeeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
    PaginatedOrderReadList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrderRead'
    PaginatedProductList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    PatchedCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: integer
          nullable: true
        parent_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedCustomer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        username:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
          writeOnly: true
        first_name:
          type: string
          writeOnly: true
        last_name:
          type: string
          writeOnly: true
        phone:
          type: string
          maxLength: 32
        city:
          type: string
          maxLength: 80
        tier:
          $ref: '#/components/schemas/TierEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedEmployee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        title:
          type: string
          maxLength: 120
        department:
          type: string
          maxLength: 80
        salary:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        manager:
          type: integer
          nullable: true
        manager_name:
          type: string
          readOnly: true
        hired_at:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sku:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 180
        description:
          type: string
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PaymentMethodEnum:
      enum:
      - card
      - cash_on_delivery
      type: string
      description: |-
        * `card` - Card
        * `cash_on_delivery` - Cash on delivery
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sku:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 180
        description:
          type: string
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - category_name
      - created_at
      - id
      - name
      - price
      - sku
      - updated_at
    ShipmentRead:
      type: object
      properties:
        carrier:
          type: string
          readOnly: true
        tracking_number:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ShipmentReadStatusEnum'
          readOnly: true
        shipped_at:
          type: string
          format: date-time
          readOnly: true
        delivered_at:
          type: string
